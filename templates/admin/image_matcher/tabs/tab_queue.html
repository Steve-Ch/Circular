<!-- tab_queue.html -->
{% if not unlinked %}
    <div class="alert alert-success mt-3 text-center">
        <i class="fas fa-check-circle"></i> No unlinked images currently in the queue!
    </div>
{% else %}
<div class="row">
    <!-- LEFT SIDE: Image & Skip -->
    <div class="col-md-6 text-center border-right">
        <h5 class="text-primary mb-2">Queue Image: {{ unlinked.filename }}</h5>
        <img src="{{ unlinked.image.url }}" class="img-fluid rounded shadow-sm mb-3" style="max-height: 400px;">
        
        <form action="{% url 'skip_image' unlinked.id %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-warning px-4">
                <i class="fas fa-forward"></i> Skip For Now
            </button>
        </form>
    </div>

    <!-- RIGHT SIDE: Search Products -->
    <div class="col-md-6" id="action-panel">
        <h5 class="mb-1">Search & Select Product</h5>
        <p class="text-muted small">Type the name of the product this image belongs to.</p>
        
        <input class="form-control form-control-lg mb-3" type="text" name="q" placeholder="Type to search products..." 
               hx-get="{% url 'search_unlinked_products' %}?unlinked_id={{ unlinked.id }}" 
               hx-trigger="keyup changed delay:300ms" hx-target="#search-results" autofocus>
        
        <div id="search-results" class="list-group"></div>
    </div>
</div>
{% endif %}
