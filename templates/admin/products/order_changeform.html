{% extends "admin/change_form.html" %}
{% block submit_buttons_bottom %}
  {{ block.super }}

  <hr style="margin: 30px 0;">

  <div style="max-width: 600px; margin: 2rem auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 0 10px; box-sizing: border-box;">
    <!-- REMOVED nested <form> tags here to fix the Django form collision -->
      
      <!-- Input Box -->
      <div style="margin-bottom: 20px;">
        <input type="text" 
               name="otp" 
               id="otpInput"
               style="width: 100%; box-sizing: border-box; padding: 10px 14px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; tracking-content: 2px;"
               placeholder="Enter OTP Here...">
      </div>

      <!-- Two Button Layout Row -->
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; box-sizing: border-box;">
        <!-- Get OTP Button (Under the input box, positioned to the Left) -->
        <button type="button"
                id="generateOtpBtn"
                style="flex: 1; box-sizing: border-box; background: #417690; color: white; border: none; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 10px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s;"
                onmouseover="this.style.backgroundColor='#2b5166'"
                onmouseout="if(!this.disabled) this.style.backgroundColor='#417690'">
          Send OTP
        </button>

        <!-- Confirm Delivery Button (Positioned to the Right, colored Green) -->
        <!-- FIX: Added formaction attribute to intercept submission directly -->
        <button type="submit"
                formaction="{% url 'admin:confirm_delivery' original.id %}"
                style="flex: 1; box-sizing: border-box; background: #28a745; color: white; padding: 12px 10px; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s;"
                onmouseover="this.style.backgroundColor='#22993e'"
                onmouseout="this.style.backgroundColor='#28a745'">
          Delivered
        </button>
      </div>
      
  </div>

  <!-- Cooldown JavaScript Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const generateBtn = document.getElementById('generateOtpBtn');
        let cooldownActive = false;

        generateBtn.addEventListener('click', function() {
            if (cooldownActive) return;

            // Trigger the Django view backend via AJAX without reloading the page
            fetch("{% url 'admin:confirm_delivery' original.id %}")
                .then(response => {
                    console.log('OTP request sent to backend');
                })
                .catch(error => console.error('Error sending OTP:', error));

            // Start 60 seconds cooldown timer
            let seconds = 60;
            cooldownActive = true;
            generateBtn.disabled = true;
            generateBtn.style.opacity = '0.6';
            generateBtn.style.cursor = 'not-allowed';
            generateBtn.innerText = `Retry in ${seconds}s`;

            const timer = setInterval(() => {
                seconds--;
                generateBtn.innerText = `Retry in ${seconds}s`;

                if (seconds <= 0) {
                    clearInterval(timer);
                    generateBtn.innerText = "Get OTP";
                    generateBtn.disabled = false;
                    generateBtn.style.opacity = '1';
                    generateBtn.style.cursor = 'pointer';
                    generateBtn.style.backgroundColor = '#417690';
                    cooldownActive = false;
                }
            }, 1000);
        });
    });
  </script>
